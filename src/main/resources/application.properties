# ==============================================================================
# CONFIGURACIÓN DE LA APLICACIÓN - AUDITORÍA (CLEAN ARCHITECTURE)
# ==============================================================================
spring.application.name=auditoria-clean-arch

server.port=8080

# Configuración de Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:auditoriadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola Web H2 para inspección de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Configuración de JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Formato JSON ISO-8601 para Fechas
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
